name: PR title

# The squash-merge commit takes the PR title as its subject, and auto-release
# reads that subject: the title must be a Conventional Commit.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: mbologna/.github/.github/workflows/pr-title.yml@dba4dba0828e75ac2b2542dc634fa068520dc8ed # main
