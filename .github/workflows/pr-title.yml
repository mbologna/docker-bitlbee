name: PR title

# The squash-merge commit takes the PR title as its subject, and auto-release
# reads that subject: the title must be a Conventional Commit.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: mbologna/.github/.github/workflows/pr-title.yml@581748d588a3d2a57a48d564a22b5cc4901d58c1 # main
